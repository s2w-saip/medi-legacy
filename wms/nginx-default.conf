# HB-WMS 경계 — 8099 하나로 네 갈래를 가른다.
#   /            S0 레거시 WMS 화면 (사람이 보는 유일한 화면)
#   /api/        연계 API — PostgREST 의 조회 뷰 + 쓰기 RPC
#   /cp/         거래처 안내 채널 — WMS 가 아니다(교정 F7). POST 만 받는다.
#   /external/   제3자 목 API — 통관·운송·기상. 고객 시스템과 경로를 가른다(교정 F11).
server {
  listen 80;
  server_name _;
  charset utf-8;
  default_type application/json;

  location / {
    root /usr/share/nginx/html;
    index index.html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://wmsapi:3000/;
    proxy_set_header Host $host;
    proxy_set_header Accept-Profile wmsapi;
    proxy_set_header Content-Profile wmsapi;
  }

  # 승인 뒤 안내 발송이 떨어지는 곳. 워크플로 webhook 액션이 POST 만 보내므로 POST 로 받는다.
  location = /cp/notifications {
    if ($request_method != POST) { return 405 '{"error":"POST only"}'; }
    proxy_pass http://wmsapi:3000/rpc/send_notice;
    proxy_set_header Content-Profile wmsapi;
  }

  location /external/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store";
  }
}
